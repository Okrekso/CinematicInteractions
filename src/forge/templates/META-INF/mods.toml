modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="cinematic_logo.png"
authors="Southware"
description='''
First-person cinematic scenes instead of block windows: craft right on the table top, load the furnace by hand, forge at the anvil, read the book on a lectern, sit down by the fire.
'''
# Optional on both sides: a client with the mod joins servers without it (vanilla windows, or the client-only scenes),
# and a client without it joins a server that has it.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
