modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="cinematic_logo.png"
authors="Southware"
description='''
First-person cinematic scenes instead of block windows: craft right on the table top, load the furnace by hand, forge at the anvil, read the book on a lectern, sit down by the fire.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.200,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: with it, the settings get a nicer screen of their own; without it, NeoForge's settings screen is used.
[[dependencies.${mod_id}]]
    modId="cloth_config"
    type="optional"
    versionRange="[15,)"
    ordering="NONE"
    side="CLIENT"
