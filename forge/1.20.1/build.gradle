plugins {
    id 'java-library'
    // ModDevGradle's plugin for Forge 1.17–1.20.1: Parchment names in development, SRG names (and a mixin refmap) in the jar.
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    // the same naming as the other ports: "Cinematic Interaction-Fabric-1.21.11-<version>.jar"
    archivesName = 'Cinematic Interaction-Forge-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Development-only scripted walkthrough of every station; screenshots go to run-showcase/screenshots.
        showcase {
            client()
            gameDirectory = project.file(project.findProperty('showcaseDir') ?: 'run-showcase')
            systemProperty 'cinematic.showcase', 'true'
            systemProperty 'cinematic.showcase.world', (project.findProperty('showcaseWorld') ?: 'cinematic-showcase').toString()
            systemProperty 'cinematic.showcase.from', (project.findProperty('from') ?: '0').toString()
            systemProperty 'cinematic.showcase.only', (project.findProperty('only') ?: 'false').toString()
            systemProperty 'cinematic.showcase.editorBatch', (project.findProperty('editorBatch') ?: 'false').toString()
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // Same walkthrough with Embeddium + Oculus and a shader pack (jars dropped into run-showcase-iris/mods).
        showcaseIris {
            client()
            gameDirectory = project.file(project.findProperty('showcaseIrisDir') ?: 'run-showcase-iris')
            systemProperty 'cinematic.showcase', 'true'
            systemProperty 'cinematic.showcase.world', (project.findProperty('showcaseWorld') ?: 'cinematic-showcase').toString()
            systemProperty 'cinematic.showcase.from', (project.findProperty('from') ?: '0').toString()
            systemProperty 'cinematic.showcase.only', (project.findProperty('only') ?: 'false').toString()
            systemProperty 'cinematic.showcase.editorBatch', (project.findProperty('editorBatch') ?: 'false').toString()
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // A real vanilla dedicated server on 127.0.0.1:25586, with no Cinematic Interactions installed.
        clientOnlySmoke {
            client()
            gameDirectory = project.file(project.findProperty('clientOnlySmokeDir') ?: 'run-showcase')
            systemProperty 'cinematic.clientOnlySmoke', 'true'
            programArguments.addAll '--width', '1280', '--height', '720'
        }

        if (project.hasProperty('joinTest')) {
            // A real network join (packets are encoded, unlike singleplayer): run joinServer, then joinClient.
            joinServer {
                server()
                gameDirectory = project.file('run-join-server')
                programArgument '--nogui'
            }
            joinClient {
                client()
                gameDirectory = project.file(project.findProperty('joinClientDir') ?: 'run-join-client')
                programArguments.addAll '--quickPlayMultiplayer', (project.findProperty('joinAddress') ?: '127.0.0.1:25589').toString()
                // -PserverSmoke: shift-clicks into stations over the real connection (client/ServerSmoke)
                if (project.hasProperty('serverSmoke')) systemProperty 'cinematic.serverSmoke', 'true'
                // -PserverSmokeReconnect: after a server restart, the table's contents must come back from the saved world
                if (project.hasProperty('serverSmokeReconnect')) {
                    systemProperty 'cinematic.serverSmoke', 'true'
                    systemProperty 'cinematic.serverSmoke.reconnect', 'true'
                }
            }
            // A Forge 1.20.1 server WITHOUT Cinematic Interactions (other mods may be added with the test-mod switches):
            // a client with the mod must join it, keep vanilla windows (or the client-only scenes) and send nothing of ours.
            plainServer {
                server()
                gameDirectory = project.file('run-plain-server')
                // set, not add: the mixin block puts --mixin.config for our (here absent) mod on every run
                programArguments.set(['--nogui'])
                loadedMods = []
            }
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            if (project.hasProperty('traceMixins')) systemProperty 'mixin.debug.export', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// Forge 1.20.1 finds a mod's mixins only through this manifest attribute (MDG passes the config to its own runs alone)
tasks.named('jar', Jar) {
    manifest.attributes(['MixinConfigs': "${mod_id}.mixins.json"])
}

repositories {
    // Local jars only: Cloth Config from Southware's "Forge 1.20.1" profile (libs/), and the test mods downloaded from
    // Modrinth with the owner's permission (test-mods/, SHA-256 in test-mods/SHA256SUMS.txt). None is bundled.
    flatDir { dirs 'libs', 'test-mods' }
}

// Test mods for the development runs, by switch: each is remapped from SRG to the development names on the way.
def testMods = [
        withCloth            : ["local:cloth-config:${cloth_config_version}-forge"],
        withJei              : ['local:jei-1.20.1-forge:15.56.0.205'],
        withJeiFull          : ['local:jei-1.20.1-forge:15.56.0.205', 'local:JustEnoughResources-1.20.1:1.4.0.247',
                                'local:JustEnoughProfessions-forge-1.20.1:3.0.1'],
        withInventoryEffects : ['local:InventoryParticles:3.2.0+1.20.1+forge', 'local:InventoryInteractions:2.2.0+1.20.1+forge',
                                'local:MossyLib:1.6.0+1.20.1+forge'],
        withInventoryParticles: ['local:InventoryParticles:3.2.0+1.20.1+forge', 'local:MossyLib:1.6.0+1.20.1+forge'],
        withShaders          : ['local:embeddium:0.3.31+mc1.20.1', 'local:oculus-mc1.20.1:1.8.0'],
        withAmendments       : ['local:amendments-1.20:2.2.6', 'local:moonlight-1.20:2.16.37-forge'],
        withEasyMods         : ['local:EasyMagic:v8.0.1-1.20.1-Forge', 'local:EasyAnvils:v8.0.2-1.20.1-Forge', 'local:PuzzlesLib:v8.1.36-1.20.1-Forge'],
        withPolymorph        : ['local:polymorph-forge:0.49.11+1.20.1'],
        withProfile          : ['local:entity_model_features:3.2.4-1.20.1-forge', 'local:entity_texture_features_1.20.1-forge:7.1',
                                'local:entityculling-forge:1.10.5-mc1.20.1', 'local:ferritecore:6.0.1-forge', 'local:xaeroworldmap-forge-1.20.1:1.45.0'],
]

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Optional integrations, compiled against and never required: the settings screen, JEI's field guide, the inventory effects.
    modCompileOnly "local:cloth-config:${cloth_config_version}-forge"
    modCompileOnly 'local:jei-1.20.1-forge:15.56.0.205'
    modCompileOnly 'local:InventoryParticles:3.2.0+1.20.1+forge'
    modCompileOnly 'local:InventoryInteractions:2.2.0+1.20.1+forge'
    modCompileOnly 'local:MossyLib:1.6.0+1.20.1+forge'
    modCompileOnly 'local:polymorph-forge:0.49.11+1.20.1'
    def wanted = [] as LinkedHashSet
    testMods.each { flag, jars -> if (project.hasProperty(flag)) wanted.addAll(jars) }
    wanted.each { modRuntimeOnly it }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '5000']
}
