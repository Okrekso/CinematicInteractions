name: Build supported versions
on:
  push:
    branches: [main]
    paths: ['src/**', 'multiversion/**', 'gradle/**', '*.gradle.kts', 'stonecutter.properties.toml', 'gradle.properties', 'gradlew*', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', 'multiversion/**', 'gradle/**', '*.gradle.kts', 'stonecutter.properties.toml', 'gradle.properties', 'gradlew*', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # dir: the Stonecutter project that builds the target (the root one or multiversion/)
        include:
          - { dir: '.', target: 1.21.1-neoforge }
          - { dir: '.', target: 1.21.1-fabric }
          - { dir: '.', target: 1.20.1-forge }
          - { dir: '.', target: 1.20.1-fabric }
          - { dir: multiversion, target: 1.21.11 }
          - { dir: multiversion, target: 26.1.1 }
          - { dir: multiversion, target: 26.1.2 }
          - { dir: multiversion, target: '26.2' }
          - { dir: multiversion, target: '26.3' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # Gradle runs on the last one; the targets compile with their own (Java 17, 21 or 25).
          java-version: |
            17
            21
            25
      - name: Build
        working-directory: ${{ matrix.dir }}
        run: bash ./gradlew --no-daemon --console=plain ":${{ matrix.target }}:build"
      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.dir }}/versions/${{ matrix.target }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
