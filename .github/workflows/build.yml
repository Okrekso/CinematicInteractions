name: Build supported versions
on:
  push:
    branches: [main]
    paths: ['src/**', 'fabric/**', 'gradle/**', '*.gradle', 'gradle.properties', 'gradlew*', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', 'fabric/**', 'gradle/**', '*.gradle', 'gradle.properties', 'gradlew*', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.loader }} ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - loader: neoforge
            minecraft: '1.21.1'
          - loader: fabric
            minecraft: '1.21'
          - loader: fabric
            minecraft: '1.21.1'
          - loader: fabric
            minecraft: '1.21.2'
          - loader: fabric
            minecraft: '1.21.3'
          - loader: fabric
            minecraft: '1.21.4'
          - loader: fabric
            minecraft: '1.21.5'
          - loader: fabric
            minecraft: '1.21.6'
          - loader: fabric
            minecraft: '1.21.7'
          - loader: fabric
            minecraft: '1.21.8'
          - loader: fabric
            minecraft: '1.21.9'
          - loader: fabric
            minecraft: '1.21.10'
          - loader: fabric
            minecraft: '1.21.11'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build NeoForge
        if: matrix.loader == 'neoforge'
        run: bash ./gradlew --no-daemon --console=plain build
      - name: Build Fabric
        if: matrix.loader == 'fabric'
        working-directory: fabric
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: bash ./gradlew --no-daemon --console=plain "-Pmc_version=$MC_VERSION" build
      - name: Upload NeoForge build
        if: matrix.loader == 'neoforge'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neoforge-${{ matrix.minecraft }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload Fabric build
        if: matrix.loader == 'fabric'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fabric-${{ matrix.minecraft }}
          path: fabric/build/${{ matrix.minecraft }}/libs/*.jar
          if-no-files-found: error
          retention-days: 14
