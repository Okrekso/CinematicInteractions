plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    // the jar's name as the owner wants to see it in the mods folder (the mod's id stays "cinematic")
    archivesName = 'Cinematic Interaction'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Development-only scripted walkthrough of every station (tools/showcase.sh); screenshots go to run-showcase/screenshots.
        showcase {
            client()
            gameDirectory = project.file(project.findProperty('showcaseDir') ?: 'run-showcase')
            systemProperty 'cinematic.showcase', 'true'
            systemProperty 'cinematic.showcase.world', (project.findProperty('showcaseWorld') ?: 'cinematic-showcase').toString()
            systemProperty 'cinematic.showcase.from', (project.findProperty('from') ?: '0').toString()
            systemProperty 'cinematic.showcase.only', (project.findProperty('only') ?: 'false').toString()
            systemProperty 'cinematic.showcase.editorBatch', (project.findProperty('editorBatch') ?: 'false').toString()
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        // Same walkthrough with Sodium + Iris and a shader pack (jars dropped into run-showcase-iris/mods).
        showcaseIris {
            client()
            gameDirectory = project.file(project.findProperty('showcaseIrisDir') ?: 'run-showcase-iris')
            systemProperty 'cinematic.showcase', 'true'
            systemProperty 'cinematic.showcase.world', (project.findProperty('showcaseWorld') ?: 'cinematic-showcase').toString()
            systemProperty 'cinematic.showcase.from', (project.findProperty('from') ?: '0').toString()
            systemProperty 'cinematic.showcase.only', (project.findProperty('only') ?: 'false').toString()
            systemProperty 'cinematic.showcase.editorBatch', (project.findProperty('editorBatch') ?: 'false').toString()
            programArguments.addAll '--width', '1600', '--height', '900'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            if (project.hasProperty('traceMixins')) systemProperty 'mixin.debug.export', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // Cloth Config: the settings screen when it is installed (optional; without it NeoForge's own screen is used)
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    // Optional integrations: these jars are never bundled or required to run Cinematic Interactions.
    compileOnly 'maven.modrinth:inventory-particles:tIeIGFCs'
    compileOnly 'maven.modrinth:inventory-interactions:U3SO7tDA'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
