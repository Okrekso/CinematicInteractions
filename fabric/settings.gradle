pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'fabric-loom'
                    && providers.gradleProperty('mc_version').getOrElse('1.21.1') == '1.21.11') {
                // The optional inventory APIs were built with Loom 1.17; keep earlier targets on 1.16.
                useVersion('1.17.21')
            }
        }
    }
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}
rootProject.name = 'cinematic-fabric'
